[project]
name = "rag"
version = "0.1.0"
description = "RAG system that answers questions about the vLLM codebase."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fire",
    "pydantic",
    "tqdm",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
exclude = ["^\\.venv/", "^data/"]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
    "pytest",
]
